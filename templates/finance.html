<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Financial Manager Pro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="/static/css/finance.css">
</head>

<body>

    <div class="header-gradient text-center">
        <h1 class="fw-bold"><i class="fas fa-wallet me-2"></i> Financial AI</h1>
        <p>Kelola uangmu dengan bantuan kecerdasan buatan</p>
    </div>

    <div class="container mt-5">
        <div class="row g-4 mb-5">
            <div class="col-lg-5">
                <div class="card card-custom p-4">
                    <h5 class="fw-bold mb-4">Input Transaksi Baru</h5>
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">PEMASUKAN (RP)</label>
                        <input type="number" id="pemasukan" class="form-control form-control-lg" placeholder="0">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">PENGELUARAN (RP)</label>
                        <input type="number" id="pengeluaran" class="form-control form-control-lg" placeholder="0">
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">CATATAN</label>
                        <input type="text" id="catatan" class="form-control"
                            placeholder="Contoh: Gaji bulanan, Beli bensin">
                    </div>
                    <button onclick="getAdvice()" class="btn btn-success btn-lg w-100 fw-bold shadow-sm">
                        <i class="fas fa-magic me-2"></i> Minta Saran AI
                    </button>

                    <div id="ai-response" class="mt-4 p-3 rounded">
                        <div class="small fw-bold text-primary mb-1"><i class="fas fa-robot"></i> AI ADVICE:</div>
                        <p id="advice-text" class="mb-0 small text-dark"></p>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="row g-3">
                    <div class="col-md-4">
                        <div class="stat-card bg-income shadow-sm">
                            <small>Total Masuk</small>
                            <h4 id="total-masuk" class="fw-bold mb-0">Rp 0</h4>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="stat-card bg-expense shadow-sm">
                            <small>Total Keluar</small>
                            <h4 id="total-keluar" class="fw-bold mb-0">Rp 0</h4>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="stat-card bg-balance shadow-sm">
                            <small>Sisa Saldo</small>
                            <h4 id="total-saldo" class="fw-bold mb-0">Rp 0</h4>
                        </div>
                    </div>
                </div>

                <div class="table-container mt-4">
                    <h5 class="fw-bold mb-3">Riwayat Transaksi</h5>
                    <table id="transaksiTable" class="table table-hover w-100">
                        <thead class="table-light">
                            <tr>
                                <th>Tanggal</th>
                                <th>Catatan</th>
                                <th>Pemasukan</th>
                                <th>Pengeluaran</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/static/js/finance.js"></script>
</body>

</html>
